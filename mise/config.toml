[tools]
node = "24.14.0"
starship = "1.26.0"
fzf = "0.74.4"
zoxide = "0.10.0"
atuin = "latest"
difftastic = "latest"
ripgrep = "latest"
bat = "latest"
bats = "latest"
kubie = "latest"
herdr = "latest"
"github:vjeantet/alerter" = "latest"
